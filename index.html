<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1a1f">
<title>Skull King Zähler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: eine Spalte wie ein Logbuch – Rangliste oben, darunter eine Karte pro Pirat mit Ansage/Stiche/Bonus. Nachtmeer + Messing. */
:root{
  --sea:#0c1a1f; --deck:#13262c; --plank:#1b333a; --line:#2a454d;
  --brass:#e2b357; --brass-2:#f3d488; --ink:#eef2ee; --mist:#9fb4b4;
  --good:#6fd39a; --bad:#ff7a6b;
  --f-display:"Pirata One","Georgia",serif;
  --f-body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--sea);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;
  background:radial-gradient(120% 60% at 50% -10%,#1d3a40 0%,var(--sea) 60%) fixed,var(--sea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sea)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.4rem;color:var(--brass);line-height:1}
h2{font-size:1.6rem;color:var(--brass-2)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mist);font-weight:700}
.num{font-variant-numeric:tabular-nums}
.btn{background:var(--brass);color:#1a1405;font-weight:800;border-radius:10px;padding:14px 18px;font-size:1.05rem;width:100%}
.btn:active{background:var(--brass-2)}
.btn.ghost{background:transparent;color:var(--brass);border:1.5px solid var(--line)}
.btn.small{width:auto;padding:8px 12px;font-size:.9rem}
.row{display:flex;gap:8px;align-items:center}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sea);padding-block:12px 10px;border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.hd{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.hd-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.hd-top .sub{color:var(--mist);font-size:.9rem}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.dot{height:30px;border-radius:6px;background:var(--deck);color:var(--mist);font-weight:700;font-size:.85rem;border:1px solid var(--line)}
.dot.done{background:var(--plank);color:var(--ink)}
.dot.cur{background:var(--brass);color:#1a1405;border-color:var(--brass)}

/* Rangliste */
.board{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--deck)}
.br{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.br:first-child{border-top:0}
.br .rk{font-family:var(--f-display);font-size:1.3rem;color:var(--mist);text-align:center}
.br.lead .rk{color:var(--brass)}
.br .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .tot{font-weight:800;font-size:1.15rem;min-width:3.5ch;text-align:right}
.delta{font-size:.85rem;font-weight:700;min-width:4.5ch;text-align:right}
.pos{color:var(--good)} .neg{color:var(--bad)} .zero{color:var(--mist)}

/* Spielerkarten */
.status{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:5px 10px;font-size:.85rem;font-weight:700;background:var(--deck);border:1px solid var(--line);color:var(--mist)}
.chip.ok{color:var(--good);border-color:#2f5a44}
.chip.warn{color:var(--bad);border-color:#5d3430}
.card{background:var(--deck);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-hd .pn{font-weight:800;font-size:1.1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-hd .pts{font-weight:800;font-size:1.25rem}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:flex;flex-direction:column;gap:6px}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:var(--plank);border-radius:10px;overflow:hidden}
.stepper button{height:46px;font-size:1.4rem;font-weight:700;color:var(--brass)}
.stepper button:active{background:var(--line)}
.stepper button:disabled{color:var(--line)}
.stepper .v{text-align:center;font-size:1.5rem;font-weight:800}
.bonus{display:flex;flex-direction:column;gap:6px}
.bonus-hd{display:flex;justify-content:space-between;align-items:center}
.bonus-hd .bv{font-weight:800;color:var(--brass-2)}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{border-radius:8px;padding:6px 9px;font-size:.82rem;background:var(--plank);border:1px solid var(--line);color:var(--ink)}
.bchip b{color:var(--brass)}
.bchip:active{background:var(--line)}
.bchip.clr{color:var(--mist)}
.hint{color:var(--mist);font-size:.82rem}
.inactive{opacity:.55}
.kby{display:flex;flex-direction:column;gap:8px;margin-top:-6px;padding:12px 14px;background:var(--deck);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px}
.kby .bchips .bchip[aria-pressed="true"]{background:var(--brass);color:#1a1405;border-color:var(--brass);font-weight:700}
.ktag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--plank);border:1px solid var(--brass);color:var(--brass);vertical-align:middle}
.tog.open{border-radius:12px 12px 0 0}
.kbtn{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--plank);border:1px solid var(--line);color:var(--mist);font-size:.88rem;font-weight:700}
.deal{display:inline-block;width:19px;height:16px;vertical-align:-2px;margin-left:6px;flex:none}
.deal rect{fill:var(--brass);stroke:var(--sea);stroke-width:1.4}
.deal rect.b{fill:var(--brass-2)}
.kbtn.dbtn::before{display:none}
.kbtn::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid currentColor;box-sizing:border-box}
.kbtn[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#1a1405}
.kbtn[aria-pressed="true"]::before{background:currentColor}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--deck);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;text-align:left}
.tog .tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.tog .tt b{font-weight:700}
.tog .tt span{color:var(--mist);font-size:.85rem}
.sw{flex:none;width:48px;height:28px;border-radius:999px;background:var(--plank);border:1px solid var(--line);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mist);transition:left .15s}
.tog[aria-checked="true"] .sw{background:var(--brass);border-color:var(--brass)}
.tog[aria-checked="true"] .sw::after{left:23px;background:#1a1405}

/* Tabelle */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--deck)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{padding:7px 9px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{color:var(--mist);font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
th:first-child,td:first-child{text-align:left;color:var(--mist)}
tfoot td{font-weight:800;color:var(--brass-2)}
td small{color:var(--mist);font-size:.72rem;margin-left:3px}

/* Setup */
.hero{padding-top:28px;display:flex;flex-direction:column;gap:6px}
.hero p{color:var(--mist);margin:0}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:28px 1fr 44px;gap:8px;align-items:center}
.prow .i{font-family:var(--f-display);color:var(--brass);font-size:1.3rem;text-align:center}
.prow input{width:100%;min-width:0;background:var(--deck);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font:inherit;font-size:1rem}
.prow button{height:44px;border-radius:10px;color:var(--mist);font-size:1.3rem;background:var(--deck);border:1px solid var(--line)}
.rules{background:var(--deck);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.9rem;color:var(--mist);display:flex;flex-direction:column;gap:4px}
.rules b{color:var(--ink)}

/* Bestätigung */
.confirm{background:var(--plank);border:1px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.win{text-align:center;padding:18px 12px;border:1px solid var(--brass);border-radius:14px;background:var(--deck);display:flex;flex-direction:column;gap:4px}
.win .crown{font-family:var(--f-display);font-size:2.6rem;color:var(--brass);line-height:1}
@media (prefers-reduced-motion:no-preference){.pts,.tot{transition:color .2s}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
const KEY='skullking-zaehler-v1';
const BONI=[
  {l:'Farb-14',v:10},{l:'Schwarze 14',v:20},{l:'Meerjungfrau gefangen',v:20},
  {l:'Pirat gefangen',v:30},{l:'Skull King gefangen',v:40},{l:'Beute-Allianz',v:20}
];
let S=load()||fresh();
let ui={view:'round',confirm:false};

function fresh(){return {phase:'setup',players:['Liam','Spieler 2','Spieler 3','Spieler 4'],round:0,done:[],data:[]};}
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function cell(r,p){
  if(!S.data[r])S.data[r]=[];
  if(!S.data[r][p])S.data[r][p]={bid:0,tricks:0,bonus:0};
  return S.data[r][p];
}
// Offizielle Wertung: Ansage 1+ getroffen = 20 pro Stich + Boni, sonst −10 pro Stich Abweichung.
// Ansage 0 getroffen = 10 × Kartenzahl + Boni, sonst −10 × Kartenzahl.
function score(r,d){
  const n=r+1;
  const b=bonusOn()?d.bonus:0;
  if(d.bid===0) return d.tricks===0 ? 10*n+b : -10*n;
  if(d.bid===d.tricks) return 20*d.bid+b;
  return -10*Math.abs(d.bid-d.tricks);
}
function total(p,upto){
  let t=0;for(let r=0;r<10;r++){if(S.done[r]&&(upto==null||r<=upto))t+=score(r,cell(r,p));}return t;
}
function stage(r){if(S.done[r])return 'done';if(!S.bidOk)S.bidOk=[];return S.bidOk[r]?'play':'bid';}
const DEAL='<svg class="deal" viewBox="0 0 21 17" role="img" aria-label="teilt aus"><rect x="1.5" y="3" width="10" height="13" rx="2" transform="rotate(-14 6.5 9.5)"/><rect class="b" x="9" y="1" width="10" height="13" rx="2" transform="rotate(10 14 7.5)"/></svg>';
function dealer(r){if(S.dealer0==null)return null;const N=S.players.length;return ((S.dealer0+r)%N+N)%N;}
function dealIcon(r,p){return dealer(r)===p?DEAL:'';}
function lastDone(){for(let r=9;r>=0;r--)if(S.done[r])return r;return -1;}
function bonusOn(){return S.bonusOn!==false}
function toggleView(){
  const on=bonusOn();
  return `<button class="tog" role="switch" aria-checked="${on}" data-act="tbonus">
    <span class="tt"><b>Bonuspunkte</b><span>${on?'An: 14er, gefangene Karten, Beute':'Aus: nur Ansage und Stiche zählen'}</span></span>
    <span class="sw" aria-hidden="true"></span></button>`;
}
function fmt(n){return n>0?'+'+n:String(n)}
function cls(n){return n>0?'pos':n<0?'neg':'zero'}

function render(){
  const app=document.getElementById('app');
  if(S.phase==='setup'){app.innerHTML=setupView();return;}
  app.innerHTML=gameView();
}

function setupView(){
  const rows=S.players.map((n,i)=>`
    <div class="prow">
      <span class="i">${i+1}</span>
      <input id="pn-${i}" value="${esc(n)}" data-i="${i}" maxlength="18" autocomplete="off" aria-label="Name von Pirat ${i+1}">
      <button data-act="rm" data-i="${i}" ${S.players.length<=2?'disabled':''} aria-label="Pirat entfernen">×</button>
    </div>`).join('');
  return `<div class="wrap">
    <div class="hero"><h1>Skull King</h1><p>Wer sitzt mit am Tisch? 2 bis 8 Piraten, in der Sitzreihenfolge im Uhrzeigersinn.</p></div>
    <div class="plist">${rows}</div>
    ${S.players.length<8?`<button class="btn ghost" data-act="add">+ Pirat hinzufügen</button>`:''}
    ${toggleView()}
    <button class="btn" data-act="start">Spiel starten</button>
    <div class="rules">
      <span class="label">Wertung</span>
      <span><b>Ansage getroffen:</b> 20 Punkte pro Stich${bonusOn()?', plus Boni':''}</span>
      <span><b>Daneben:</b> −10 pro Stich Abweichung</span>
      <span><b>Null getroffen:</b> 10 × Kartenzahl${bonusOn()?', plus Boni':''}</span>
      <span><b>Null verfehlt:</b> −10 × Kartenzahl</span>
    </div>
  </div>`;
}

function gameView(){
  const r=S.round,n=r+1,P=S.players;
  const dots=Array.from({length:10},(_,i)=>`<button class="dot num ${i===r?'cur':S.done[i]?'done':''}" data-act="go" data-r="${i}" aria-label="Runde ${i+1}">${i+1}</button>`).join('');
  const over=S.done.filter(Boolean).length===10;
  const header=`<header><div class="hd">
    <div class="hd-top"><h1>Runde ${n}</h1><span class="sub">${n} ${n===1?'Karte':'Karten'} pro Pirat</span></div>
    <div class="dots">${dots}</div></div></header>`;

  // Rangliste
  const ld=lastDone(), stg=stage(r);
  const ranking=P.map((name,p)=>({name,p,t:total(p),d:ld>=0?score(ld,cell(ld,p)):null})).sort((a,b)=>b.t-a.t);
  const best=ranking[0].t;
  const board=`<div class="board">${ranking.map((x,i)=>`
    <div class="br ${x.t===best?'lead':''}">
      <span class="rk num">${ranking.findIndex(y=>y.t===x.t)+1}</span>
      <span class="nm">${esc(x.name)}${dealIcon(r,x.p)}</span>
      <span class="delta num ${x.d==null?'zero':cls(x.d)}">${x.d==null?'':fmt(x.d)}</span>
      <span class="tot num">${x.t}</span>
    </div>`).join('')}</div>`;

  let body='';
  if(over && ui.view==='round' && r===9 && S.done[9]){
    const winners=ranking.filter(x=>x.t===best).map(x=>esc(x.name)).join(' & ');
    body+=`<div class="win"><span class="label">Neuer Skull King</span><span class="crown">${winners}</span><span class="num" style="color:var(--mist)">${best} Punkte</span></div>`;
  }

  // Status
  const sb=P.reduce((s,_,p)=>s+cell(r,p).bid,0), st=P.reduce((s,_,p)=>s+cell(r,p).tricks,0);
  if(!S.kraken)S.kraken=[];
  const kr=!!S.kraken[r], exp=n-(kr?1:0);
  const trickChip = st===exp ? `<span class="chip ok num">Stiche ${st}/${exp} ✓</span>`
    : st<exp ? `<span class="chip warn num">Stiche ${st}/${exp}</span>` : `<span class="chip warn num">Stiche ${st}/${exp} – zu viele</span>`;
  const bidChip = `<span class="chip num">Angesagt ${sb} bei ${n} ${sb>n?'· Kampf um Stiche':sb<n?'· Stiche übrig':'· genau aufgeteilt'}</span>`;

  if(ui.view==='table'){
    body+=tableView();
  }else{
    if(stg==='bid'){
      const dl=dealer(r);
      const dealHint = dl!=null
        ? `${esc(P[dl])} teilt aus, ${esc(P[(dl+1)%P.length])} spielt zuerst aus.`
        : `Optional: Tippe bei einem Spieler auf «Teilt aus», dann zeigt die App ab jetzt in jeder Runde an, wer austeilt.`;
      body+=`<div class="status">${bidChip}</div><span class="hint">Schritt 1 von 2: Alle sagen an, wie viele Stiche sie machen. Danach bestätigen.<br>${dealHint}</span>`;
      body+=P.map((name,p)=>bidCard(r,p,name)).join('');
      body+=`<button class="btn" data-act="bidok">Ansagen bestätigen</button>`;
    }else{
    body+=`<div class="status">${bidChip}${trickChip}</div>`;
    if(stg==='play') body+=`<span class="hint">Schritt 2 von 2: Erreichte Stiche eintragen. Die Punkte zählen erst, wenn du die Runde abschliesst.</span>`;
    if(!S.krakenBy)S.krakenBy=[];
    const kb=S.krakenBy[r];
    const kname=kr&&kb!=null&&P[kb]!=null?esc(P[kb]):null;
    if(kname) body+=`<span class="hint">Kraken von ${kname} gespielt – ein Stich geht an niemanden.</span>`;
    else if(st===n-1) body+=`<span class="hint">Fehlt ein Stich? Dann wurde wohl der Kraken gespielt – tippe beim Spieler auf «Kraken gespielt».</span>`;
    body+=P.map((name,p)=>cardView(r,p,name)).join('');
    if(!S.done[r]){
      body+=`<button class="btn" data-act="finish">${r===9?'Spiel beenden':'Runde '+n+' abschliessen'}</button>`;
      body+=`<button class="btn ghost" data-act="bidedit">Ansagen ändern</button>`;
    }else if(r<9){
      body+=`<button class="btn" data-act="go" data-r="${r+1}">Weiter zu Runde ${n+1}</button>`;
    }
    }
  }

  const tools=`<div class="row">
    <button class="btn ghost small" data-act="view">${ui.view==='table'?'Zurück zur Runde':'Tabelle aller Runden'}</button>
    <span style="flex:1"></span>
    <button class="btn ghost small" data-act="new">Neues Spiel</button>
  </div>`;
  const conf= ui.confirm ? `<div class="confirm"><span>Aktuelles Spiel löschen und neu beginnen? Die Namen bleiben erhalten.</span>
    <div class="row"><button class="btn small" data-act="reset" style="background:var(--bad)">Ja, neu beginnen</button><button class="btn ghost small" data-act="cancel">Abbrechen</button></div></div>`:'';

  return header+`<div class="wrap" style="margin-top:14px">${board}${body}${toggleView()}${tools}${conf}</div>`;
}

function bidCard(r,p,name){
  const d=cell(r,p),n=r+1;
  return `<section class="card">
    <div class="card-hd"><span class="pn">${esc(name)}${dealIcon(r,p)}</span></div>
    ${stepper('Ansage','bid',p,d.bid,n)}
    <button class="kbtn dbtn" aria-pressed="${dealer(r)===p}" data-act="deal" data-p="${p}">${DEAL.replace('class="deal"','class="deal" style="margin-left:0"')} Teilt aus</button>
  </section>`;
}
function lockedBid(v){
  return `<div class="step"><span class="label">Ansage</span><div class="stepper" style="grid-template-columns:1fr"><span class="v num" style="line-height:46px;color:var(--brass-2)">${v}</span></div></div>`;
}
function cardView(r,p,name){
  const d=cell(r,p),n=r+1,pts=score(r,d),isDone=S.done[r];
  const hit=d.bid===d.tricks;
  const chips=BONI.map((b,i)=>`<button class="bchip" data-act="bonus" data-p="${p}" data-v="${b.v}">${b.l} <b>+${b.v}</b></button>`).join('');
  return `<section class="card">
    <div class="card-hd"><span class="pn">${esc(name)}${dealIcon(r,p)}${S.kraken&&S.kraken[r]&&S.krakenBy&&S.krakenBy[r]===p?'<span class="ktag">Kraken</span>':''}</span>${isDone?`<span class="pts num ${cls(pts)}">${fmt(pts)}</span>`:''}</div>
    <div class="steps">
      ${isDone?stepper('Ansage','bid',p,d.bid,n):lockedBid(d.bid)}
      ${stepper('Stiche','tricks',p,d.tricks,n)}
    </div>
    <button class="kbtn" aria-pressed="${!!(S.kraken&&S.kraken[r]&&S.krakenBy&&S.krakenBy[r]===p)}" data-act="kby" data-p="${p}">Kraken gespielt</button>
    ${bonusOn()?`<div class="bonus ${hit?'':'inactive'}">
      <div class="bonus-hd"><span class="label">Bonus${hit?'':' · zählt nur bei getroffener Ansage'}</span><span class="bv num">${d.bonus?'+'+d.bonus:'0'}</span></div>
      <div class="bchips">${chips}${d.bonus?`<button class="bchip clr" data-act="bclr" data-p="${p}">Bonus zurücksetzen</button>`:''}</div>
    </div>`:''}
  </section>`;
}
function stepper(label,f,p,v,max){
  return `<div class="step"><span class="label">${label}</span>
    <div class="stepper"><button data-act="dec" data-f="${f}" data-p="${p}" ${v<=0?'disabled':''} aria-label="${label} weniger">−</button>
    <span class="v num">${v}</span>
    <button data-act="inc" data-f="${f}" data-p="${p}" ${v>=max?'disabled':''} aria-label="${label} mehr">+</button></div></div>`;
}

function tableView(){
  const P=S.players;
  const head=`<tr><th>Runde</th>${P.map(n=>`<th>${esc(n)}</th>`).join('')}</tr>`;
  let rows='';
  for(let r=0;r<10;r++){
    if(!S.done[r])continue;
    rows+=`<tr><td>${r+1}</td>${P.map((_,p)=>{const d=cell(r,p),s=score(r,d);return `<td class="${cls(s)}">${dealer(r)===p?DEAL.replace('margin','x').replace('class="deal"','class="deal" style="margin:0 4px 0 0"'):''}${s}<small>${d.bid}/${d.tricks}</small></td>`}).join('')}</tr>`;
  }
  const foot=`<tr><td>Total</td>${P.map((_,p)=>`<td>${total(p)}</td>`).join('')}</tr>`;
  if(!rows) rows=`<tr><td colspan="${P.length+1}" style="text-align:left">Noch keine Runde abgeschlossen.</td></tr>`;
  return `<div class="tbl"><table><thead>${head}</thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div>
    <span class="hint">Klein daneben: Ansage/Stiche. Das Kartensymbol zeigt, wer in der Runde ausgeteilt hat. Es erscheinen nur abgeschlossene Runden.</span>`;
}

document.addEventListener('input',e=>{
  const t=e.target;if(t.dataset.i!=null){S.players[+t.dataset.i]=t.value;save();}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,p=+b.dataset.p,r=S.round;
  switch(a){
    case 'add':S.players.push('Spieler '+(S.players.length+1));break;
    case 'rm':S.players.splice(+b.dataset.i,1);break;
    case 'start':
      S.players=S.players.map((n,i)=>n.trim()||('Spieler '+(i+1)));
      S.phase='game';S.round=0;S.done=[];S.data=[];S.kraken=[];S.krakenBy=[];S.bidOk=[];S.dealer0=null;break;
    case 'inc':cell(r,p)[b.dataset.f]++;break;
    case 'dec':cell(r,p)[b.dataset.f]--;break;
    case 'bonus':cell(r,p).bonus+=+b.dataset.v;break;
    case 'bclr':cell(r,p).bonus=0;break;
    case 'tbonus':S.bonusOn=!bonusOn();break;
    case 'kraken':if(!S.kraken)S.kraken=[];if(!S.krakenBy)S.krakenBy=[];S.kraken[r]=!S.kraken[r];if(!S.kraken[r])S.krakenBy[r]=null;break;
    case 'kby':if(!S.krakenBy)S.krakenBy=[];if(!S.kraken)S.kraken=[];
      if(S.kraken[r]&&S.krakenBy[r]===p){S.kraken[r]=false;S.krakenBy[r]=null;}
      else{S.kraken[r]=true;S.krakenBy[r]=p;}
      break;
    case 'deal':{const N=S.players.length;if(dealer(r)===p)S.dealer0=null;else S.dealer0=((p-r)%N+N)%N;break;}
    case 'bidok':if(!S.bidOk)S.bidOk=[];S.bidOk[r]=true;window.scrollTo(0,0);break;
    case 'bidedit':if(!S.bidOk)S.bidOk=[];S.bidOk[r]=false;break;
    case 'finish':S.done[r]=true;if(r<9)S.round=r+1;ui.view='round';window.scrollTo(0,0);break;
    case 'go':S.round=+b.dataset.r;ui.view='round';break;
    case 'view':ui.view=ui.view==='table'?'round':'table';break;
    case 'new':ui.confirm=true;break;
    case 'cancel':ui.confirm=false;break;
    case 'reset':ui.confirm=false;S.phase='setup';S.round=0;S.done=[];S.data=[];S.kraken=[];S.krakenBy=[];S.bidOk=[];S.dealer0=null;ui.view='round';break;
  }
  save();render();
});
render();
})();
</script>
</body>
</html>
